applicationName: ""
fullnameOverride: ""
namespaceOverride: ""
chartVersionOverride: ""

additionalLabels: {}
componentOverride: ""
partOfOverride: ""

global:
  configuration:
    enabled: false
    overwrite: true
    secrets: {}

  settings:
    # -- Global databasehost, overrides setting.database.host
    databaseHost: ""

configuration:
  enabled: false
  overwrite: true
  superuser:
    username: ""
    password: ""
    email: ""
  job:
    # -- Run the setup configuration command as a job
    enabled: false
    additionalLabels: {}
    annotations: {}
    backoffLimit: 0
    # -- 0 Will clean the job after it is finished
    restartPolicy: Never
    # Note, this field is immutable
    resources: {}

  secrets: {}
  data: ""

tags:
  redis: true

replicaCount: 2

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

startupProbe:
  enabled: true
  # -- Startup probe configuration - allows up to 5 minutes for application startup
  # -- Total time: 15s initial delay + (30 failures x 10s period) = 315s (5 minutes 15 seconds)
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1
  httpGet:
    path: /admin/
    port: http

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
  httpGet:
    path: /admin/
    port: http

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
  httpGet:
    path: /admin/
    port: http

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  className: ""
  # -- ingress hosts
  hosts: []
  #  - host: application.gemeente.nl
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  tls: []
  #  - secretName: application-tls
  #    hosts:
  #      - application.gemeente.nl

# -- Specify extra ingresses, for example if you have multiple ingress classes
extraIngress: []
# e.g:
# extraIngress:
#  - name: application-azuregateway
#    annotations:
#      appgw.ingress.kubernetes.io/ssl-redirect: "true"
#    className: azure-application-gateway
#    hosts:
#      - host: application.gemeente.nl
#        paths:
#          - path: /
#            pathType: ImplementationSpecific
#            servicename: application
#            portNumber: 8000
#    tls:
#      - secretName: application-tls
#        hosts:
#          - "application.gemeente.nl"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  create: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  existingClaim: null
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClassName: ""
  volumeMode: ""
  volumeName: ""
  additionalLabels: {}
  annotations: {}
  # -- If null, use "<application.name>/media" and "<application.name>/private_media"
  mediaMountSubpath: ""
  privateMediaMountSubpath: ""

# Existing Secret must be defined for AzureVaultSecret to work
existingSecret: null
# Reference to an existing secret with the values needed for django-setup-configuration
existingConfigurationSecrets: null
# If no secret already exists with the values needed for django-setup-configuration, create it with the following name
configurationSecretsName: ""

# This will create an AzureVaultSecret object in k8s, only Multi Key Value Secret are supported by this chart
# ref: https://akv2k8s.io/tutorials/sync/4-multi-key-value-secret/ https://learn.microsoft.com/en-us/azure/key-vault/secrets/multiline-secrets
# Using this feature requires you to define existingSecret
azureVaultSecret:
  # The name of the Azure Key Vault, setting this will create the AzureVaultSecret
  vaultName: null
  # The name of the Multi Key Value Secret
  objectName: ""
  # Make sure this matches the content of the secret, can be either 'application/x-json' or 'application/x-yaml'
  contentType: ""
  # You must set .Values.existingSecret
  secretName: "{{ .Values.existingSecret }}"

# -- Array with extra environment variables to add
extraEnvVars: []
# e.g:
# extraEnvVars:
#   - name: FOO
#     value: "bar"

# -- Optionally specify extra list of additional volumes
extraVolumes: []
# e.g:
# extraVolumes:
#   - name: verify-certs
#     configMap:
#       name: verify-certs

# -- Optionally specify extra list of additional volumeMounts
extraVolumeMounts: []
# e.g:
# extraVolumeMounts:
#  - name: verify-certs
#    mountPath: /etc/ssl/certs/extra-certs/

configMap:
  additionalLabels: {}
  annotations: {}
  

secret:
  additionalLabels: {}
  annotations: {}
  files: {}

settings:
  allowedHosts: ""
  djangoSettingsModule: ""
  useXForwardedHost: false

  # -- Required: dominio principale dell'applicazione
  siteDomain: ""

  # -- Disable two factor authentication
  disable2fa: false

  # -- Generate secret key at https://djecrety.ir/
  secretKey: ""

  # -- sets the 'ENVIRONMENT' variable
  environment: ""

  elasticapm:
    url: ""
    token: ""
    serviceName: ""

  database:
    host: ""
    port: 5432
    username: ""
    password: ""
    name: ""
    sslmode: prefer
    db_conn_max_age: null
    db_pool:
      enabled: false
      db_pool_min_size: null
      db_pool_max_size: null
      db_pool_timeout: null
      db_pool_max_waiting: null
      db_pool_max_lifetime: null
      db_pool_max_idle: null
      db_pool_reconnect_timeout: null
      db_pool_num_workers: null

  email:
    host: localhost
    port: 25
    username: ""
    password: ""
    useTLS: false
    defaultFrom: ""

  sentry:
    dsn: ""

  # Cache settings, when the redis subchart is enabled these settings will be ignored and caching will default to the redis subchart services.
  cache:
    # e.g.:
    # default: myapp-redis-master-0:6379/0
    # axes: myapp-redis-master-0:6379/0
    default: ""
    axes: ""
    oidc: ""

  # Celery settings, when the redis subchart is enabled these settings will be ignored and the broker/backend default to the redis subchart services
  celery:
    # e.g.:
    # brokerUrl: redis://myapp-redis-master:6379/1
    # resultBackend: redis://myapp-redis-master:6379/1
    brokerUrl: ""
    resultBackend: ""
    logLevel: debug
    resultExpires: ""

  logging:
    level: ""
    requests: false
    outgoingRequests: false
    outgoingRequestsDBSave: false
    outgoingRequestsDBSaveBody: false
    outgoingRequestsResetDBSaveAfter: null
    outgoingRequestsMaxAge: null

  notifications:
    disabled: false
    logInDb: false
    numberOfDaysRetained: null
    source: ""

  admin:
    searchDisabled: false

  jsonschema:
    useFormatChecker: false

  otel:
    disabled: false
    resourceAttributes: []
    exporterOtlpEndpoint: ""
    exporterOtlpMetricsInsecure: false
    exporterOtlpProtocol: ""
    metricExportInterval: ""
    metricExportTimeout: ""

  enableCloudEvents: false

  isHttps: true

  debug: false

  uwsgi:
    master: ""
    threads: ""
    processes: ""
    maxRequests: ""
    harakiri: ""

  # -- Extra keys/values
  extraSettings: {}
  #  CUSTOM_FEATURE_FLAG: "True"
   #  THIRD_PARTY_API_KEY: mysecretkey

worker:
  replicaCount: 2
  concurrency: 4
  podLabels: {}
  resources: {}
    # requests:
    #   cpu: 250m
    #   memory: 256Mi
  label: celery
  queueName: ""
  name: ""
  # Defaults to 60s
  maxWorkerLivenessDelta: ""
  livenessProbe:
    enabled: false
    exec:
      command:
        - /app/liveness/liveness-probe.sh
    initialDelaySeconds: 60
    # Periodseconds should not exceed maxWorkerLivenessDelta
    periodSeconds: 50
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

flower:
  enabled: true
  replicaCount: 1
  podLabels: {}
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

beat:
  enabled: true
  replicaCount: 1
  podLabels: {}
  livenessProbe: {}
  readinessProbe: {}
  resources: {}

##################
# Redis subchart #
##################

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  image:
    registry: docker.io  # Docker registry for Redis image
    repository: redis  # Official Redis image (migrated from Bitnami)
    tag: "8.0"  # Official Redis image pinned version
